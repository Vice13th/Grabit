[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grabit"
version = "1.0.4"
description = "Universal media downloader with a layered, plugin-style engine architecture."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "yt-dlp>=2024.4.9",
    "gallery-dl>=1.26",
    "instaloader>=4.11",
    "gdown>=5.1",
    "pinterest-dl>=0.7",
    "PyYAML>=6.0",
    "bilix>=0.19",
    "twitch-archiver>=3.1",
    "soundcloud-lib>=0.6",
    "RedDownloader>=2.7",
    "tiktok-downloader-py>=1.0",
    "instacapture>=0.1",
    "civitai-downloader>=0.2",
]

[project.optional-dependencies]
extra = [
    "streamlink>=6.7 ; python_version >= '3.10'",
    "spotdl>=4.2 ; python_version >= '3.10'",
    "ytmusicapi>=1.4 ; python_version >= '3.10'",
    "playwright>=1.43",
    "imageio-ffmpeg>=0.4",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
grabit = "grabit.app:main"

[tool.setuptools.packages.find]
include = ["grabit*"]

[tool.setuptools.package-data]
grabit = ["gui/assets/*.png"]
